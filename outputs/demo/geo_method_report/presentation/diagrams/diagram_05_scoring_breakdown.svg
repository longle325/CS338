  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="56" y="62" font-size="34" fill="#101827" font-weight="900" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="56" dy="0">Reranking score hoạt động ra sao?</tspan></text>
  <text x="58" y="96" font-size="18" fill="#64748b" font-weight="600" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="58" dy="0">Score tập trung vào vùng affordance thay vì đánh giá toàn ảnh một cách mơ hồ.</tspan></text>
