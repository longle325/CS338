<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#101827"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="56" y="62" font-size="34" fill="#101827" font-weight="900" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="56" dy="0">GACS end-to-end khi tích hợp vào OmniTry</tspan></text>
  <text x="58" y="96" font-size="18" fill="#64748b" font-weight="600" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="58" dy="0">Phương pháp mới là inference-time wrapper quanh model pretrained.</tspan></text>
  <rect x="50" y="255" width="205" height="155" rx="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="72" y="293" font-size="28" fill="#2563eb" font-weight="700" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="72" dy="0">1</tspan></text><text x="108" y="291" font-size="24" fill="#2563eb" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="108" dy="0">Input</tspan></text><text x="72" y="330" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="72" dy="0">person + object +</tspan><tspan x="72" dy="23">class</tspan></text><line x1="260" y1="330" x2="300" y2="330" stroke="#101827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="295" y="255" width="205" height="155" rx="22" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/><text x="317" y="293" font-size="28" fill="#ea580c" font-weight="700" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="317" dy="0">2</tspan></text><text x="353" y="291" font-size="24" fill="#ea580c" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="353" dy="0">Affordance prompt</tspan></text><text x="317" y="330" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="317" dy="0">class-specific</tspan><tspan x="317" dy="23">geometry</tspan></text><line x1="505" y1="330" x2="545" y2="330" stroke="#101827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="540" y="255" width="205" height="155" rx="22" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/><text x="562" y="293" font-size="28" fill="#7c3aed" font-weight="700" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="562" dy="0">3</tspan></text><text x="598" y="291" font-size="24" fill="#7c3aed" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="598" dy="0">Frozen OmniTry</tspan></text><text x="562" y="330" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="562" dy="0">generate K</tspan><tspan x="562" dy="23">candidates</tspan></text><line x1="750" y1="330" x2="790" y2="330" stroke="#101827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="785" y="255" width="205" height="155" rx="22" fill="#d1fae5" stroke="#86efac" stroke-width="2"/><text x="807" y="293" font-size="28" fill="#059669" font-weight="700" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="807" dy="0">4</tspan></text><text x="843" y="291" font-size="24" fill="#059669" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="843" dy="0">Score</tspan></text><text x="807" y="330" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="807" dy="0">object + person +</tspan><tspan x="807" dy="23">artifact</tspan></text><line x1="995" y1="330" x2="1035" y2="330" stroke="#101827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1030" y="255" width="205" height="155" rx="22" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/><text x="1052" y="293" font-size="28" fill="#101827" font-weight="700" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="1052" dy="0">5</tspan></text><text x="1088" y="291" font-size="24" fill="#101827" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="1088" dy="0">Select</tspan></text><text x="1052" y="330" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="1052" dy="0">best output +</tspan><tspan x="1052" dy="23">diagnostics</tspan></text><rect x="330" y="470" width="610" height="86" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="360" y="505" font-size="22" fill="#101827" font-weight="900" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="360" dy="0">Điểm tích hợp chính:</tspan></text><text x="580" y="505" font-size="20" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="580" dy="0">Không train lại. Không đổi checkpoint. Chỉ thêm</tspan><tspan x="580" dy="25">prompt, sampling, và reranking.</tspan></text>
