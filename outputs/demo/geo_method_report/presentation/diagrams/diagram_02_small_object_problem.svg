<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#101827"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="56" y="62" font-size="34" fill="#101827" font-weight="900" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="56" dy="0">Vì sao vật phẩm nhỏ cần cải tiến?</tspan></text>
  <text x="58" y="96" font-size="18" fill="#64748b" font-weight="600" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="58" dy="0">Model pretrained có thể đẹp toàn ảnh nhưng sai vùng affordance.</tspan></text>
  <rect x="58" y="160" width="240" height="130" rx="22" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/><text x="80" y="196" font-size="24" fill="#ea580c" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="80" dy="0">Global prompt</tspan></text><text x="80" y="235" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="80" dy="0">&quot;trying on ring&quot;</tspan><tspan x="80" dy="23">không nói rõ ngón</tspan><tspan x="80" dy="23">nào, scale nào,</tspan><tspan x="80" dy="23">occlusion nào</tspan></text><line x1="305" y1="225" x2="450" y2="225" stroke="#101827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="450" y="145" width="280" height="200" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="480" y="188" font-size="26" fill="#101827" font-weight="900" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="480" dy="0">Small-object ambiguity</tspan></text><text x="480" y="230" font-size="19" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="480" dy="0">Vật phẩm nhỏ có footprint</tspan><tspan x="480" dy="24">thấp;</tspan><tspan x="480" dy="24">many plausible placements;</tspan><tspan x="480" dy="24">model tối ưu realism toàn</tspan><tspan x="480" dy="24">ảnh.</tspan></text><line x1="735" y1="205" x2="875" y2="160" stroke="#101827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="735" y1="245" x2="875" y2="300" stroke="#101827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="735" y1="285" x2="875" y2="445" stroke="#101827" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="875" y="105" width="310" height="95" rx="22" fill="#ffe4e6" stroke="#fda4af" stroke-width="2"/><text x="897" y="141" font-size="24" fill="#e11d48" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="897" dy="0">Failure 1</tspan></text><text x="897" y="180" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="897" dy="0">Sai vị trí / sai body</tspan><tspan x="897" dy="23">part</tspan></text><rect x="875" y="255" width="310" height="95" rx="22" fill="#ffe4e6" stroke="#fda4af" stroke-width="2"/><text x="897" y="291" font-size="24" fill="#e11d48" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="897" dy="0">Failure 2</tspan></text><text x="897" y="330" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="897" dy="0">Vật phẩm mờ hoặc biến</tspan><tspan x="897" dy="23">mất</tspan></text><rect x="875" y="405" width="310" height="95" rx="22" fill="#ffe4e6" stroke="#fda4af" stroke-width="2"/><text x="897" y="441" font-size="24" fill="#e11d48" font-weight="800" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="897" dy="0">Failure 3</tspan></text><text x="897" y="480" font-size="18" fill="#64748b" font-weight="500" text-anchor="start" font-family="Inter, Arial, sans-serif"><tspan x="897" dy="0">Giữ object tốt hơn</tspan><tspan x="897" dy="23">nhưng phá người /</tspan><tspan x="897" dy="23">artifact</tspan></text><rect x="110" y="420" width="140" height="170" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="180" y="452" font-size="18" fill="#64748b" font-weight="500" text-anchor="middle" font-family="Inter, Arial, sans-serif"><tspan x="180" dy="0">hand</tspan></text><circle cx="180" cy="515" r="52" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/><circle cx="204" cy="500" r="7" fill="none" stroke="#e11d48" stroke-width="4"/><text x="180" y="612" font-size="18" fill="#e11d48" font-weight="800" text-anchor="middle" font-family="Inter, Arial, sans-serif"><tspan x="180" dy="0">ring chỉ vài pixel</tspan></text>
</svg>
